<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이오리듬 - 돈데크만</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main id="app">
  <div id="stage" class="text-stage">
    <canvas id="screen" width="720" height="400" aria-label="바이오리듬 화면"></canvas>
  </div>

  <p id="summary" class="summary" aria-live="polite"></p>

  <div id="options">
    <button type="button" id="btn-restart">처음으로</button>
  </div>

  <section id="paper-wrap" class="paper-wrap" hidden>
    <div class="row">
      <strong>🖨️ 인쇄 용지 (원작의 LPRINT 출력)</strong>
      <span class="spacer"></span>
      <button type="button" id="btn-print">인쇄</button>
      <button type="button" id="btn-paper-close">닫기</button>
    </div>
    <pre id="paper"></pre>
  </section>

  <footer>
    원작: 정상혁 (1993년, QuickBasic, BIO.BAS). 웹 재구현 2026.
    숫자 키로 메뉴를 고르고 생년월일은 네 자리 연도로 입력합니다. 모바일에서는 화면을 누르면 키보드가 나옵니다.
    <br><a href="../index.html">← 게임 선택으로</a>
  </footer>
</main>

<script src="../textscreen.js"></script>
<script src="bio.js"></script>
</body>
</html>

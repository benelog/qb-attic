<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기 - Quick Basic 프로그램 보관소</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main id="app">
  <div id="stage" class="text-stage">
    <canvas id="screen" width="720" height="400" aria-label="계산기 화면"></canvas>
  </div>

  <p id="status" class="status" aria-live="polite"></p>

  <div id="keys" class="key-row" role="group" aria-label="편집 키">
    <button type="button" data-key="+">+</button>
    <button type="button" data-key="-">−</button>
    <button type="button" data-key="*">×</button>
    <button type="button" data-key="/">÷</button>
    <button type="button" data-key="Tab">Tab</button>
    <button type="button" data-key="ArrowUp">↑</button>
    <button type="button" data-key="ArrowDown">↓</button>
    <button type="button" data-key="Home">Home</button>
    <button type="button" data-key="End">End</button>
    <button type="button" data-key="Delete">Del</button>
    <button type="button" data-key="&#8;">←</button>
    <button type="button" data-key="&#27;">Esc</button>
    <button type="button" id="btn-restart">처음부터</button>
  </div>

  <footer>
    원작: 정상혁 (1993년, QuickBasic 4.5, CALCU2.BAS). 웹 재구현 2026.
    숫자를 치고 <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> 키를 누르면 그 연산자가 다음 줄 앞에 붙고 줄이 넘어갑니다.
    줄 앞의 연산자는 그 줄의 값을 결과에 더하거나 빼거나 곱하거나 나눕니다.
    <kbd>Enter</kbd>는 원작대로 아무 일도 하지 않습니다. <kbd>↑</kbd> <kbd>↓</kbd>로 줄을 오가며 고치고, <kbd>Tab</kbd>은 연산자만 바꿉니다.
    <kbd>Esc</kbd> 두 번이면 끝납니다. 모바일에서는 화면을 누르면 키보드가 나옵니다.
    <br><a href="../index.html">← 프로그램 목록으로</a>
  </footer>
</main>

<script src="../textscreen.js"></script>
<script src="calcu.js"></script>
</body>
</html>

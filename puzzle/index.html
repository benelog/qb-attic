<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퍼즐 그림 맞추기 - 돈데크만</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main id="app">
  <div id="stage">
    <canvas id="screen" width="640" height="480" aria-label="퍼즐 그림 맞추기 화면"></canvas>

    <div id="overlay" class="overlay" hidden>
      <div class="panel" id="panel-name" hidden>
        <h2>🏆 최고 기록 진입!</h2>
        <p id="name-summary"></p>
        <form id="name-form" autocomplete="off">
          <input id="name-input" type="text" maxlength="10" placeholder="이름 (최대 10자)" required>
          <button type="submit">저장</button>
        </form>
      </div>
      <div class="panel" id="panel-rank" hidden>
        <h2>🏁 순위표</h2>
        <table id="rank-table">
          <thead><tr><th>#</th><th>이름</th><th>시간</th><th>이동</th><th>배치</th><th>날짜</th></tr></thead>
          <tbody></tbody>
        </table>
        <p class="hint">순위는 시간이 짧은 순, 같으면 이동 횟수가 적은 순입니다. 이 브라우저의 Local Storage에 저장됩니다.</p>
        <div class="row">
          <button id="rank-close" type="button">닫기</button>
          <button id="rank-clear" type="button" class="danger">기록 삭제</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dpad" role="group" aria-label="조각 이동 버튼">
    <button type="button" data-dir="up" aria-label="위로">↑</button>
    <button type="button" data-dir="left" aria-label="왼쪽으로">←</button>
    <button type="button" data-dir="down" aria-label="아래로">↓</button>
    <button type="button" data-dir="right" aria-label="오른쪽으로">→</button>
  </div>

  <div id="puzzle-actions">
    <button type="button" id="btn-new">새 게임</button>
    <button type="button" id="btn-giveup">포기 (Q)</button>
    <button type="button" id="btn-rank">순위표</button>
  </div>

  <div id="options">
    <label>시작 배치
      <select id="opt-layout">
        <option value="random">무작위 (풀 수 있는 배치)</option>
        <option value="original">원작 고정 배치</option>
      </select>
    </label>
    <label><input type="checkbox" id="opt-sound" checked> 소리</label>
  </div>

  <footer>
    원작: 브니엘고 컴퓨터부, 정상혁 (1995년, QuickBasic 4.5 + SVGAQB, PUZZLE.BAS). 웹 재구현 2026.
    화살표 키는 조각이 움직이는 방향입니다. 빈 칸 옆의 조각을 클릭해도 됩니다. <kbd>Q</kbd> 포기.
    <br><a href="../index.html">← 프로그램 목록으로</a>
  </footer>
</main>

<div id="assets" hidden>
  <img id="img-screen" src="assets/puzzle_screen.png" alt="">
  <img id="img-blank" src="assets/puzzle_blank.png" alt="">
</div>

<script src="puzzle.js"></script>
</body>
</html>

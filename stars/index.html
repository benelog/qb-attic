<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 별 여행 - Quick Basic 프로그램 보관소</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main id="app">
  <div id="stage">
    <canvas id="screen" width="640" height="480" aria-label="3D 별 여행 화면"></canvas>
  </div>

  <p id="status" class="status" aria-live="polite"></p>

  <div id="options">
    <label>별 개수 <input type="number" id="opt-count" min="1" max="500" value="20" style="width:5em"></label>
    <label>속도
      <select id="opt-fps">
        <option value="30">느리게 (30fps)</option>
        <option value="60">보통 (60fps)</option>
        <option value="120">빠르게 (120fps)</option>
      </select>
    </label>
    <button type="button" id="btn-pause" aria-pressed="false">멈춤</button>
    <button type="button" id="btn-restart">처음부터</button>
  </div>

  <footer>
    원작: 정상혁 (1995년, QuickBasic 4.5, 3D.BAS). 웹 재구현 2026.
    별이 다가오며 시점이 천천히 흔들립니다. 원작은 명령행 인자로 별 개수를 받았고 아무 키나 누르면 끝났습니다.
    웹 버전은 <kbd>Space</kbd>나 화면 누르기로 멈추고, 별 개수는 <code>?n=100</code>처럼 주소에 붙여도 됩니다.
    원작에는 프레임 제한이 없어 속도가 CPU에 따라 달랐습니다.
    <br><a href="../index.html">← 프로그램 목록으로</a>
  </footer>
</main>

<script src="stars.js"></script>
</body>
</html>

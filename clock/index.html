<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아날로그 시계 - 돈데크만</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main id="app">
  <div id="stage" class="clock-stage">
    <canvas id="screen" width="640" height="480" aria-label="아날로그 시계 화면"></canvas>
  </div>

  <p id="info" class="status" aria-live="off"></p>

  <div id="options">
    <label>시침
      <select id="opt-hour">
        <option value="original">원작 그대로 (TA -시)</option>
        <option value="fixed">고친 시침 (시·분으로 계산)</option>
      </select>
    </label>
    <button type="button" id="btn-restart">다시 그리기</button>
    <button type="button" id="btn-end">끝내기 (E)</button>
  </div>

  <footer>
    원작: 정상혁 (1995년, QuickBasic, CLOCK.BAS). 웹 재구현 2026.
    원작은 지금 바늘을 검은색으로 그리고 1초 전 바늘을 흰색으로 덮어 지웁니다.
    그래서 지나간 초침이 흰 선으로 쌓여 1분이면 햇살 무늬가 됩니다.
    <kbd>E</kbd> 끝내기.
    <br><a href="../index.html">← 게임 선택으로</a>
  </footer>
</main>

<script src="clock.js"></script>
</body>
</html>
